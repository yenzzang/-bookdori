<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>책돌이 — 교환독서 릴레이</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --bg:#FFFFFF;
    --ink:#3A3A3A;
    --ink-soft:#8B8B95;
    --border:#F0EEF5;
    --pink:#FF8FA3;
    --sky:#6FC3F7;
    --yellow:#FFCB4C;
    --mint:#5FD3A3;
    --lavender:#B49BFF;
    --shadow: rgba(180,166,255,0.18);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Gowun Dodum', sans-serif;
    min-height:100vh; padding: 26px 16px 60px;
  }
  h1,h2,h3,.jua{font-family:'Jua', sans-serif; font-weight:400;}
  .wrap{max-width: 1060px; margin: 0 auto;}
  .brand{
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;
    margin-bottom: 26px;
  }
  .brand h1{
    font-size: 32px; margin:0; color:var(--ink);
    display:flex; align-items:center; gap:8px;
  }
  .brand .tag{
    font-size:12px; color:var(--ink-soft); background:#FAF9FF; border:1px solid var(--border);
    padding:6px 12px; border-radius:20px;
  }
  .card{
    background: #fff;
    border:1px solid var(--border);
    border-radius: 20px;
    box-shadow: 0 8px 20px var(--shadow);
  }
  /* ---------- SETUP ---------- */
  #setup .card{padding:30px; max-width:640px; margin: 0 auto;}
  #setup h2{font-size:22px; margin-top:0;}
  #setup p.desc{color:var(--ink-soft); font-size:13.5px; margin-top:-6px;}
  .member-row{
    display:grid; grid-template-columns: 40px 1fr 1fr 34px; gap:8px; align-items:center; margin-bottom:10px;
  }
  .color-swatch{
    width:36px; height:36px; border-radius:50%; border:2px solid #fff; box-shadow:0 0 0 2px var(--border);
    padding:0; cursor:pointer; overflow:hidden;
  }
  .color-swatch::-webkit-color-swatch{border:none; border-radius:50%;}
  .color-swatch::-webkit-color-swatch-wrapper{padding:0;}
  input[type=text]{
    font-family:'Gowun Dodum',sans-serif; font-size:14px; padding:10px 12px;
    border:1.5px solid var(--border); border-radius:12px; background:#FBFBFE; color:var(--ink); width:100%;
  }
  input[type=text]:focus{outline:none; border-color:var(--lavender); background:#fff;}
  .rm-btn{
    width:32px; height:32px; border-radius:50%; border:none; background:#FFF0F2; color:var(--pink);
    cursor:pointer; font-size:14px; line-height:1;
  }
  .rm-btn:disabled{opacity:0.3; cursor:default;}
  .add-row-btn{
    width:100%; padding:10px; border:1.5px dashed var(--border); background:#FBFBFE; border-radius:12px;
    color:var(--ink-soft); cursor:pointer; font-size:13px; margin-bottom:14px;
  }
  .add-row-btn:hover{border-color:var(--lavender); color:var(--lavender);}
  .order-hint{
    font-size:12px; color:var(--ink-soft); margin: 16px 0 8px; font-weight:600;
  }
  .order-list{list-style:none; padding:0; margin:0 0 18px;}
  .order-list li{
    display:flex; align-items:center; gap:10px; padding:9px 12px; margin-bottom:7px;
    background:#FBFBFE; border:1.5px solid var(--border); border-radius:14px; font-size:14px;
  }
  .order-list li .dotc{width:10px; height:10px; border-radius:50%; flex-shrink:0;}
  .order-list li span.pos{font-family:'Jua',sans-serif; color:var(--lavender); width:18px;}
  .order-list button{
    margin-left:auto; border:none; background:#F3F1FB; cursor:pointer; font-size:13px; color:var(--ink-soft);
    padding:4px 9px; border-radius:8px;
  }
  .order-list button:hover{background:#E9E5FB; color:var(--ink);}
  .btn{
    font-family:'Jua',sans-serif; font-size:14px;
    background:var(--lavender); color:#fff; border:none; border-radius:16px;
    padding:13px 22px; cursor:pointer; box-shadow:0 6px 14px rgba(180,166,255,0.4);
  }
  .btn:hover{filter:brightness(1.05); transform: translateY(-1px);}
  .btn:active{transform: translateY(0px);}
  .btn.secondary{background:#F3F1FB; color:var(--ink); box-shadow:none;}
  .btn.small{padding:9px 14px; font-size:12.5px; border-radius:12px;}
  .btn.pink{background:var(--pink); box-shadow:0 6px 14px rgba(255,143,163,0.4);}
  .btn.mint{background:var(--mint); box-shadow:0 6px 14px rgba(95,211,163,0.4);}
  .btn:disabled{opacity:0.4; cursor:default;}

  /* ---------- MAIN ---------- */
  #main{display:none;}
  .round-banner{
    display:flex; align-items:center; gap:16px; margin-bottom:24px; flex-wrap:wrap;
  }
  .round-badge{
    width:78px; height:78px; border-radius:50%;
    background: linear-gradient(135deg, var(--lavender), var(--sky));
    color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center;
    flex-shrink:0; box-shadow:0 8px 16px rgba(180,166,255,0.35);
  }
  .round-badge .n{font-family:'Jua',sans-serif; font-size:24px; line-height:1;}
  .round-badge .lbl{font-size:10px;}
  .round-info{font-size:13px; color:var(--ink-soft); line-height:1.7;}
  .season-chip{
    font-size:11px; background:#F3F1FB; color:var(--lavender); padding:4px 11px; border-radius:12px; font-weight:700;
  }

  /* relay rail */
  .rail{
    display:flex; align-items:flex-start; gap:0; overflow-x:auto; padding: 10px 4px 18px;
    margin-bottom: 24px;
  }
  .rail-node{
    display:flex; flex-direction:column; align-items:center; min-width:118px; position:relative;
  }
  .rail-node .dot{
    width:52px; height:52px; border-radius:50%; color:#fff;
    display:flex; align-items:center; justify-content:center; font-family:'Jua',sans-serif;
    font-size:18px; box-shadow:0 6px 12px rgba(0,0,0,0.12);
  }
  .rail-node .name{font-size:12.5px; margin-top:8px; font-weight:600;}
  .rail-node .books{margin-top:6px; display:flex; flex-direction:column; gap:3px; align-items:center;}
  .rail-node .books span{
    font-size:10px; background:#FAF6E3; color:#8a6a12; padding:3px 8px; border-radius:10px;
    max-width:110px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .rail-arrow{
    flex:1; min-width:26px; height:52px; display:flex; align-items:center; justify-content:center;
    color:#E2DFF2; font-size:20px;
  }

  .grid{
    display:grid; grid-template-columns: repeat(auto-fill, minmax(232px,1fr)); gap:16px;
  }
  .book{
    padding:18px; display:flex; flex-direction:column; gap:8px; position:relative;
    border-top: 5px solid var(--lavender);
  }
  .book .owner-tag{
    font-size:11px; font-weight:700; letter-spacing:0.2px;
  }
  .book h3{font-size:19px; margin:0; line-height:1.3;}
  .book .author{font-size:12px; color:var(--ink-soft); margin-top:-6px;}
  .holder-line{font-size:13px; margin-top:2px;}
  .holder-line b{font-weight:700;}
  .badge{
    display:inline-block; font-size:11px; padding:4px 10px; font-weight:600;
    border-radius:12px; width:fit-content;
  }
  .badge.idle{background:#F3F1FB; color:var(--ink-soft);}
  .badge.sent{background:#FFF3D6; color:#9A7712;}
  .badge.received{background:#E3FAF0; color:#1F8A5E;}
  .review-box textarea{
    width:100%; font-family:'Gowun Dodum',sans-serif; font-size:13px; padding:10px; border:1.5px solid var(--border);
    border-radius:12px; resize:vertical; min-height:52px; background:#FBFBFE;
  }
  .stars{display:flex; gap:2px; margin:6px 0 4px;}
  .stars span{cursor:pointer; font-size:17px; color:#EDEAF8;}
  .stars span.on{color:var(--yellow);}
  .reviews{display:flex; flex-direction:column; gap:6px; margin-top:4px;}
  .reviews .rv{
    font-size:12px; background:#FBFBFE; border-left:4px solid var(--lavender); padding:6px 9px; border-radius:8px;
    line-height:1.4;
  }
  .reviews .rv b{font-weight:700;}
  .reviews .rv .stars-mini{color:var(--yellow); font-size:11px;}

  .advance-bar{
    text-align:center; margin: 26px 0; padding:20px; border-radius:18px;
    background: linear-gradient(135deg, #EEFBF5, #F1F8FF);
  }
  .advance-bar p{font-size:13px; color:#1F8A5E; margin:0 0 10px; font-weight:600;}

  .finished{text-align:center; padding:44px 20px;}
  .finished h2{font-size:28px;}

  .history{margin-top:36px;}
  .history h4{font-size:13px; color:var(--ink-soft); font-weight:700;}
  .history ul{list-style:none; padding:0; margin:0; border-left:2px solid var(--border); padding-left:14px;}
  .history li{
    font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft); margin-bottom:9px; position:relative;
  }
  .history li::before{
    content:''; position:absolute; left:-18px; top:4px; width:7px; height:7px; border-radius:50%; background:var(--pink);
  }
  .footer-actions{margin-top:40px; text-align:center;}
  .footer-actions a{font-size:11.5px; color:var(--ink-soft); cursor:pointer; text-decoration:underline; margin:0 8px;}
  .notice{font-size:11px; color:var(--ink-soft); margin-top:8px;}

  /* archive */
  #archiveSection{margin-top:40px;}
  #archiveSection h4{font-size:13px; color:var(--ink-soft); font-weight:700; margin-bottom:10px;}
  details.archive-item{
    border:1.5px solid var(--border); border-radius:16px; padding:14px 18px; margin-bottom:10px; background:#FDFDFF;
  }
  details.archive-item summary{
    cursor:pointer; font-family:'Jua',sans-serif; font-size:14.5px; list-style:none; display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  }
  details.archive-item summary::-webkit-details-marker{display:none;}
  details.archive-item summary .meta{font-family:'Gowun Dodum',sans-serif; font-size:11.5px; color:var(--ink-soft); font-weight:400;}
  details.archive-item[open] summary{margin-bottom:10px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <h1>📖 책돌이</h1>
    <div class="tag">교환독서 릴레이</div>
  </div>

  <!-- SETUP -->
  <div id="setup">
    <div class="card">
      <h2 id="setupTitle">모임을 시작해볼까요? 🌷</h2>
      <p class="desc">이름, 나만의 볼펜 색, 시작하는 책 제목을 입력하세요. 인원은 자유롭게 추가/삭제할 수 있어요.</p>
      <div id="memberInputs"></div>
      <button class="add-row-btn" id="addMemberBtn">+ 멤버 추가</button>
      <div class="order-hint">🔁 교환 순서 (▲▼로 조정, 이 순서대로 책이 돌아요)</div>
      <ul class="order-list" id="orderList"></ul>
      <button class="btn" id="startBtn" style="margin-top:6px;">시작하기 ✨</button>
      <div class="notice">※ 이 정보는 링크를 공유받는 모두에게 보이는 공용 데이터예요.</div>
    </div>
  </div>

  <!-- MAIN -->
  <div id="main">
    <div id="roundView"></div>
    <div class="history">
      <h4>📝 이번 시즌 히스토리</h4>
      <ul id="historyList"></ul>
    </div>
    <div class="footer-actions"><a id="resetLink">현재 시즌 초기화</a></div>
  </div>

  <div id="archiveSection" style="display:none;">
    <h4>📚 지난 교환독서 기록</h4>
    <div id="archiveList"></div>
  </div>
</div>

<script>
/* =========================================================
   Firebase 설정 — Firebase 콘솔에서 발급받은 값으로 교체하세요.
   (Firebase Console > 프로젝트 설정 > 일반 > 내 앱 > SDK 설정 및 구성)
   ========================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyCm9O8_SbSoc63PJDay1EOMz0LXSEM3cT8",
  authDomain: "bookdori-a77d4.firebaseapp.com",
  projectId: "bookdori-a77d4",
  storageBucket: "bookdori-a77d4.firebasestorage.app",
  messagingSenderId: "29532607448",
  appId: "1:29532607448:web:33b1756495c764fd0898ad"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const COLLECTION = 'bookclub'; // Firestore 컬렉션 이름 (그대로 둬도 됨)

let config = null;
let state = null;
let archive = [];
let nextSeasonNum = 1;
const DEFAULT_COLORS = ['#FF8FA3','#6FC3F7','#FFCB4C','#5FD3A3','#B49BFF','#FF9F6B','#8FD9E8','#C792EA'];

/* Firestore 문서 하나에 { data: <값> } 형태로 저장/조회 */
async function dbGet(key){
  const snap = await db.collection(COLLECTION).doc(key).get();
  return snap.exists ? snap.data().data : null;
}
async function dbSet(key, value){
  await db.collection(COLLECTION).doc(key).set({ data: value });
}
async function dbDelete(key){
  await db.collection(COLLECTION).doc(key).delete();
}

async function saveConfig(){
  try{ await dbSet('config', config); }
  catch(e){ console.error('saveConfig failed', e); }
}
async function saveState(){
  try{ await dbSet('state', state); }
  catch(e){ console.error('saveState failed', e); }
}
async function saveArchive(){
  try{ await dbSet('archive', archive); }
  catch(e){ console.error('saveArchive failed', e); }
}

/* 최초 1회 로드 후, 실시간 리스너로 다른 멤버의 변경사항을 즉시 반영 (폴링 없음) */
function attachListeners(){
  db.collection(COLLECTION).doc('config').onSnapshot(snap=>{
    config = snap.exists ? snap.data().data : null;
    if(!config && draftMembers.every(m=>!m.name && !m.book)){
      nextSeasonNum = archive.length + 1;
    }
    render();
  }, err=> console.error('config listener error', err));

  db.collection(COLLECTION).doc('state').onSnapshot(snap=>{
    state = snap.exists ? snap.data().data : null;
    render();
  }, err=> console.error('state listener error', err));

  db.collection(COLLECTION).doc('archive').onSnapshot(snap=>{
    archive = snap.exists ? (snap.data().data || []) : [];
    render();
  }, err=> console.error('archive listener error', err));
}

function nowStr(){
  const d = new Date();
  return d.getMonth()+1+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}

/* ---------------- SETUP SCREEN ---------------- */
let draftIdSeed = 0;
function freshMember(color){
  draftIdSeed++;
  return {id:'m'+Date.now()+'_'+draftIdSeed, name:'', book:'', author:'', color: color || DEFAULT_COLORS[draftIdSeed % DEFAULT_COLORS.length]};
}
let draftMembers = [0,1,2,3,4].map(i=> freshMember(DEFAULT_COLORS[i]));
let draftOrder = draftMembers.map(m=>m.id);

function renderSetup(){
  document.getElementById('setupTitle').textContent =
    nextSeasonNum > 1 ? `${nextSeasonNum}회차 교환독서, 준비해볼까요? 🌱` : '모임을 시작해볼까요? 🌷';

  const mi = document.getElementById('memberInputs');
  mi.innerHTML = draftMembers.map((m,i)=>`
    <div class="member-row">
      <input type="color" class="color-swatch" value="${m.color}" oninput="draftMembers[${i}].color=this.value; renderOrderList();" title="볼펜 색">
      <input type="text" placeholder="이름" value="${m.name}" oninput="draftMembers[${i}].name=this.value; renderOrderList();">
      <input type="text" placeholder="시작하는 책 제목" value="${m.book}" oninput="draftMembers[${i}].book=this.value;">
      <button class="rm-btn" onclick="removeMember(${i})" ${draftMembers.length<=2?'disabled':''} title="삭제">✕</button>
    </div>
  `).join('');
  renderOrderList();
}

document.getElementById('addMemberBtn').addEventListener('click', ()=>{
  const m = freshMember();
  draftMembers.push(m);
  draftOrder.push(m.id);
  renderSetup();
});

function removeMember(i){
  if(draftMembers.length<=2){ alert('최소 2명은 필요해요.'); return; }
  const id = draftMembers[i].id;
  draftMembers.splice(i,1);
  draftOrder = draftOrder.filter(x=>x!==id);
  renderSetup();
}

function renderOrderList(){
  const ol = document.getElementById('orderList');
  ol.innerHTML = draftOrder.map((id,i)=>{
    const m = draftMembers.find(x=>x.id===id);
    if(!m) return '';
    const label = m.name || ('멤버 '+(draftMembers.indexOf(m)+1));
    return `<li>
      <span class="pos">${i+1}</span>
      <span class="dotc" style="background:${m.color};"></span>
      <span>${label}</span>
      <button onclick="moveOrder(${i},-1)" ${i===0?'disabled':''}>▲</button>
      <button onclick="moveOrder(${i},1)" ${i===draftOrder.length-1?'disabled':''}>▼</button>
    </li>`;
  }).join('');
}
function moveOrder(i, dir){
  const j = i+dir;
  if(j<0 || j>=draftOrder.length) return;
  [draftOrder[i], draftOrder[j]] = [draftOrder[j], draftOrder[i]];
  renderOrderList();
}

document.getElementById('startBtn').addEventListener('click', async ()=>{
  if(draftMembers.length < 2){ alert('최소 2명은 필요해요.'); return; }
  if(draftMembers.some(m=>!m.name.trim() || !m.book.trim())){
    alert('모든 멤버의 이름과 시작 책 제목을 입력해주세요.');
    return;
  }
  config = {
    members: draftMembers.map(m=>({id:m.id, name:m.name.trim(), color:m.color})),
    books: draftMembers.map(m=>({id:'b_'+m.id, ownerId:m.id, title:m.book.trim(), author:m.author||''})),
    order: draftOrder.slice()
  };
  state = {
    seasonNum: nextSeasonNum,
    round: 0,
    bookStatus: {},
    reviews: [],
    history: [{ts: nowStr(), text: `📚 ${nextSeasonNum}회차 모임이 시작되었습니다!`}]
  };
  config.books.forEach(b=> state.bookStatus[b.id] = 'idle');
  render();
  await saveConfig();
  await saveState();
});

document.getElementById('resetLink').addEventListener('click', async ()=>{
  if(!confirm('현재 시즌을 초기화할까요? (지난 기록은 보존돼요)')) return;
  config = null; state = null;
  draftMembers = [0,1,2,3,4].map(i=> freshMember(DEFAULT_COLORS[i]));
  draftOrder = draftMembers.map(m=>m.id);
  nextSeasonNum = archive.length + 1;
  render();
  await dbDelete('config').catch(()=>{});
  await dbDelete('state').catch(()=>{});
});

/* ---------------- MAIN SCREEN LOGIC ---------------- */
function holderOf(book, cfg, st){
  cfg = cfg||config; st = st||state;
  const ownerPos = cfg.order.indexOf(book.ownerId);
  const pos = (ownerPos + st.round) % cfg.order.length;
  return cfg.order[pos];
}
function nextHolderOf(book, cfg, st){
  cfg = cfg||config; st = st||state;
  const ownerPos = cfg.order.indexOf(book.ownerId);
  const pos = (ownerPos + st.round + 1) % cfg.order.length;
  return cfg.order[pos];
}
function memberObj(id, cfg){ cfg = cfg||config; return (cfg && cfg.members.find(x=>x.id===id)) || {name:'?', color:'#999'}; }
function memberName(id, cfg){ return memberObj(id,cfg).name; }
function memberColor(id, cfg){ return memberObj(id,cfg).color || '#B49BFF'; }

function render(){
  renderArchive();
  if(!config || !state){
    document.getElementById('setup').style.display='block';
    document.getElementById('main').style.display='none';
    renderSetup();
    return;
  }
  document.getElementById('setup').style.display='none';
  document.getElementById('main').style.display='block';

  const totalRounds = config.members.length;
  if(state.round >= totalRounds){
    renderFinished();
    return;
  }

  const rv = document.getElementById('roundView');
  const allReceived = config.books.every(b => state.bookStatus[b.id] === 'received');

  const railHtml = config.order.map((mid,i)=>{
    const booksHere = config.books.filter(b=>{
      const st = state.bookStatus[b.id];
      const h = st==='sent' ? nextHolderOf(b) : holderOf(b);
      return h === mid;
    });
    const arrow = i < config.order.length-1 ? `<div class="rail-arrow">→</div>` : `<div class="rail-arrow" style="min-width:0;"></div>`;
    return `<div class="rail-node">
        <div class="dot" style="background:${memberColor(mid)};">${memberName(mid)[0]}</div>
        <div class="name" style="color:${memberColor(mid)};">${memberName(mid)}</div>
        <div class="books">${booksHere.map(b=>`<span title="${b.title}">${b.title}</span>`).join('')}</div>
      </div>${arrow}`;
  }).join('');

  const booksHtml = config.books.map(b=>{
    const status = state.bookStatus[b.id];
    const holder = holderOf(b);
    const next = nextHolderOf(b);
    const myReviews = state.reviews.filter(r=>r.bookId===b.id).sort((a,c)=>a.round-c.round);
    const ownerColor = memberColor(b.ownerId);

    let actionHtml = '';
    if(status === 'idle'){
      actionHtml = `
        <button class="btn small mint" onclick="openReview('${b.id}')">다 읽었어요, 보내기 📮</button>
        <div id="revform_${b.id}" style="display:none; margin-top:8px;" class="review-box">
          <select id="who_${b.id}" style="width:100%; font-family:'Gowun Dodum',sans-serif; font-size:13px; padding:9px 10px; border:1.5px solid var(--border); border-radius:12px; background:#FBFBFE; color:var(--ink); margin-bottom:8px;">
            ${config.members.map(m=>`<option value="${m.id}" ${m.id===holder?'selected':''}>${m.name}</option>`).join('')}
          </select>
          <div class="stars" id="stars_${b.id}">${[1,2,3,4,5].map(n=>`<span data-n="${n}" onclick="setStar('${b.id}',${n})">★</span>`).join('')}</div>
          <textarea id="txt_${b.id}" placeholder="한줄평을 남겨주세요 (🔒 시즌 종료 전까지는 비공개예요)"></textarea>
          <button class="btn small pink" style="margin-top:6px;" onclick="submitSend('${b.id}')">한줄평 남기고 보내기 →</button>
        </div>`;
    } else if(status === 'sent'){
      actionHtml = `
        <div class="badge sent">📮 발송됨 → ${memberName(next)}에게 가는 중</div>
        <button class="btn small" style="margin-top:8px;" onclick="markReceived('${b.id}')">${memberName(next)}, 받았어요! 🙌</button>`;
    } else {
      actionHtml = `<div class="badge received">✔ 수령 완료 · 라운드 대기중</div>`;
    }

    return `<div class="card book" style="border-top-color:${ownerColor};">
      <div class="owner-tag" style="color:${ownerColor};">✒ 원작자 · ${memberName(b.ownerId)}</div>
      <h3>${b.title}</h3>
      ${b.author ? `<div class="author">${b.author}</div>` : ''}
      <div class="holder-line">지금 여기 있어요: <b style="color:${memberColor(holder)};">${memberName(holder)}</b>${status==='sent'?` (곧 ${memberName(next)}에게)`:''}</div>
      ${actionHtml}
      ${myReviews.length? `<div class="badge idle">🔒 한줄평 ${myReviews.length}개 · 시즌 종료 후 공개</div>` : ''}
    </div>`;
  }).join('');

  rv.innerHTML = `
    <div class="round-banner">
      <div class="round-badge"><div class="n">${state.round+1}</div><div class="lbl">ROUND</div></div>
      <div class="round-info"><span class="season-chip">${state.seasonNum||1}회차</span> · ${state.round+1} / ${totalRounds} 회차 진행 중 🎈<br>전원이 책을 다 읽고 넘기면 다음 회차로 이동해요.</div>
    </div>
    <div class="rail">${railHtml}</div>
    <div class="grid">${booksHtml}</div>
    ${allReceived ? `<div class="advance-bar">
        <p>🎉 전원 수령 완료! 다음 라운드로 넘어갈 준비가 되었어요.</p>
        <button class="btn pink" onclick="advanceRound()">다음 라운드 시작 →</button>
      </div>` : ''}
  `;
  renderHistory();
}

function bookReviewsHtml(cfg, st, b){
  const myReviews = st.reviews.filter(r=>r.bookId===b.id).sort((a,c)=>a.round-c.round);
  return myReviews.length? `<div class="reviews">${myReviews.map(r=>`<div class="rv" style="border-left-color:${memberColor(r.memberId,cfg)};"><b style="color:${memberColor(r.memberId,cfg)};">${memberName(r.memberId,cfg)}</b> · <span class="stars-mini">${'★'.repeat(r.rating||0)}${'☆'.repeat(5-(r.rating||0))}</span><br>${escapeHtml(r.text)}</div>`).join('')}</div>` : `<div class="notice">한줄평이 없어요.</div>`;
}

function renderFinished(){
  document.getElementById('roundView').innerHTML = `
    <div class="card finished">
      <h2>🎉 ${state.seasonNum||1}회차, 모두 완독했어요!</h2>
      <p>한 바퀴를 다 돌았습니다. 새 멤버 구성으로 다음 시즌을 시작할 수 있어요.</p>
      <button class="btn pink" onclick="startNewSeasonSetup()" style="margin-top:10px;">🔄 다음 교환독서 준비하기</button>
    </div>
    <div class="grid" style="margin-top:20px;">
      ${config.books.map(b=>{
        const ownerColor = memberColor(b.ownerId);
        return `<div class="card book" style="border-top-color:${ownerColor};">
          <div class="owner-tag" style="color:${ownerColor};">✒ 원작자 · ${memberName(b.ownerId)}</div>
          <h3>${b.title}</h3>
          ${bookReviewsHtml(config, state, b)}
        </div>`;
      }).join('')}
    </div>
  `;
  renderHistory();
}

async function startNewSeasonSetup(){
  const seasonNum = state.seasonNum || (archive.length+1);
  archive.push({seasonNum, config, state, finishedAt: nowStr()});
  await saveArchive();

  draftMembers = config.members.map(m=> ({id:'m'+Date.now()+'_'+Math.random().toString(36).slice(2,6), name:m.name, book:'', author:'', color:m.color}));
  draftOrder = draftMembers.map(m=>m.id);
  nextSeasonNum = seasonNum + 1;

  config = null; state = null;
  render();
  await dbDelete('config').catch(()=>{});
  await dbDelete('state').catch(()=>{});
}

function renderArchive(){
  const sec = document.getElementById('archiveSection');
  const list = document.getElementById('archiveList');
  if(!archive.length){ sec.style.display='none'; return; }
  sec.style.display='block';
  list.innerHTML = archive.slice().reverse().map(a=>{
    const names = a.config.members.map(m=>`<span style="color:${m.color};font-weight:700;">${m.name}</span>`).join(', ');
    const books = a.config.books.map(b=>{
      const ownerColor = memberColor(b.ownerId, a.config);
      return `<div class="card book" style="border-top-color:${ownerColor};">
        <div class="owner-tag" style="color:${ownerColor};">✒ 원작자 · ${memberName(b.ownerId, a.config)}</div>
        <h3>${b.title}</h3>
        ${bookReviewsHtml(a.config, a.state, b)}
      </div>`;
    }).join('');
    return `<details class="archive-item">
      <summary>📚 ${a.seasonNum}회 교환독서 <span class="meta">${names} · ${a.finishedAt} 완료</span></summary>
      <div class="grid">${books}</div>
    </details>`;
  }).join('');
}

function renderHistory(){
  const hl = document.getElementById('historyList');
  hl.innerHTML = state.history.slice().reverse().map(h=>`<li>[${h.ts}] ${escapeHtml(h.text)}</li>`).join('');
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

let draftStars = {};
function openReview(bookId){
  document.getElementById('revform_'+bookId).style.display = 'block';
}
function setStar(bookId, n){
  draftStars[bookId] = n;
  const el = document.getElementById('stars_'+bookId);
  [...el.children].forEach(s=> s.classList.toggle('on', Number(s.dataset.n) <= n));
}

async function submitSend(bookId){
  const txt = document.getElementById('txt_'+bookId).value.trim();
  if(!txt){ alert('한줄평을 입력해주세요.'); return; }
  const b = config.books.find(x=>x.id===bookId);
  const who = document.getElementById('who_'+bookId).value;
  state.reviews.push({bookId, round: state.round, memberId: who, text: txt, rating: draftStars[bookId]||0});
  state.bookStatus[bookId] = 'sent';
  state.history.push({ts: nowStr(), text: `${memberName(who)}님이 "${b.title}"을(를) 다 읽고 ${memberName(nextHolderOf(b))}님에게 보냈어요.`});
  render();
  await saveState();
}

async function markReceived(bookId){
  const b = config.books.find(x=>x.id===bookId);
  const next = nextHolderOf(b);
  state.bookStatus[bookId] = 'received';
  state.history.push({ts: nowStr(), text: `${memberName(next)}님이 "${b.title}"을(를) 받았어요.`});
  render();
  await saveState();
}

async function advanceRound(){
  state.round += 1;
  config.books.forEach(b=> state.bookStatus[b.id] = 'idle');
  state.history.push({ts: nowStr(), text: `— ${state.round+1}회차 시작 —`});
  render();
  await saveState();
}

attachListeners();
</script>
</body>
</html>
